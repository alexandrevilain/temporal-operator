name: End2End tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

env:
  KIND_VERSION: v0.33.0
  OPERATOR_IMAGE_PATH: /tmp/temporal-operator.tar

jobs:
  run-e2e:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kube-version:
          - tag: v1.34.11
            kind-image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - tag: v1.35.8
            kind-image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - tag: v1.36.4
            kind-image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - tag: v1.37.0
            kind-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    name: Run generate E2E tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: temporal-operator:latest
          cache-from: type=gha
          cache-to: type=gha
          outputs: type=docker,dest=${{ env.OPERATOR_IMAGE_PATH }}

      - name: Install Kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}

      - name: Free some disk space
        run: sudo rm -rf /usr/share/dotnet && sudo rm -rf /opt/ghc && sudo rm -rf "/usr/local/share/boost"

      - name: Run e2e test suite
        run: make test-e2e
        env:
          OPERATOR_IMAGE_PATH: ${{ env.OPERATOR_IMAGE_PATH }}
          KUBERNETES_VERSION: ${{ matrix.kube-version.tag }}
          KIND_IMAGE: ${{ matrix.kube-version.kind-image }}

      - name: Archive e2e logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts-${{ matrix.kube-version.tag }}
          path: out/tests/e2e/
